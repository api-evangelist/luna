aid: luna
name: Luna
description: >-
  Luna is an in-home physical therapy company that dispatches licensed physical
  therapists to patients' homes for 1:1 treatment sessions covered by insurance,
  including Medicare and major commercial plans. The company supports orthopedic,
  sports medicine, neurologic, post-surgical, and geriatric rehabilitation across
  a nationwide network of thousands of therapists, reaching roughly 85K patients
  and more than 1.2M in-home PT visits in 2024. Luna was surfaced as a portfolio
  company of 8vc and added to the API Evangelist network. It is a consumer
  healthcare service with no public developer or API program at this time.
